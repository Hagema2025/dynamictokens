name: Extract BMS Tokens

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  repository_dispatch:
    types: [trigger-token-extractor] 
  # Uncomment below to run automatically (e.g., every 6 hours)
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  extract-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fails fast if Cloudflare blocks it forever
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install and Setup Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install cloudflare-warp -y
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5

      - name: Install System Dependencies (Xvfb & Chromium)
        run: |
          sudo apt-get update
          for i in 1 2 3; do sudo apt-get install -y xvfb chromium-browser && break || sleep 10; done
          
      - name: Install Python Dependencies
        run: pip install DrissionPage requests

      - name: Run Token Extractor Script
        env:
          # Ensure these are set in your GitHub Repo -> Settings -> Secrets and variables
          GITHUB_REPO_SHOWS: ${{ secrets.REPO_SHOWS }}
          GITHUB_TOKEN_SHOWS: ${{ secrets.TOKEN_SHOWS }}
          GITHUB_SDYNAMICTOKENS_PATH: ${{ secrets.SDYNAMICTOKENS_PATH }}
          GITHUB_BRANCH_SHOWS: ${{ secrets.BRANCH_SHOWS }}
        # xvfb-run creates a virtual display so co.headless(False) doesn't crash
        run: xvfb-run -a python main.py
      - name: Upload Debug Screenshot
        uses: actions/upload-artifact@v4
        if: always() # Ensures it uploads even if the python script fails
        with:
          name: cloudflare-debug
          path: cloudflare_debug.png
